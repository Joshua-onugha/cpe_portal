<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2 style="color: var(--primary); margin-bottom: 20px;">Admin Login</h2>
            
            {% if error %}
                <div style="background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div style="text-align: left; margin-bottom: 5px;"><b>Username</b></div>
                <input type="text" name="username" placeholder="Enter username" required>
                
                <div style="text-align: left; margin-bottom: 5px; margin-top: 15px;"><b>Password</b></div>
                <input type="password" name="password" placeholder="Enter password" required>
                
                <button type="submit" class="btn" style="margin-top: 20px;">Login securely</button>
            </form>
            
            <br>
            <a href="/" style="color: #666; font-size: 0.9rem;">&larr; Back to Student Portal</a>
        </div>
    </div>

    <div class="site-footer">
        &copy; 2026 Department of Computer Engineering, University of Benin. All Rights Reserved.
    </div>
</body>
</html>
