<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Acadetect</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-banner {
            background: var(--primary);
            color: var(--accent);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            border: 2px solid var(--accent);
        }
        .summary-item h1 { font-size: 3rem; margin: 0; color: white; }
        .summary-item p { margin: 0; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo" style="display: flex; align-items: center; font-weight: normal; font-size: 1.4rem;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px; opacity: 0.9;">
                    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                    <path d="M6 11a4 4 0 0 1 7.5-1.5"></path>
                    <path d="M10 11l2.5-2.5"></path>
                    <path d="M15 7h4"></path>
                    <path d="M15 9h4"></path>
                    <path d="M15 11h4"></path>
                    <circle cx="5" cy="14" r="0.5" fill="currentColor" stroke="none"></circle>
                    <path d="M7 14h4"></path>
                    <circle cx="5" cy="16" r="0.5" fill="currentColor" stroke="none"></circle>
                    <path d="M7 16h4"></path>
                    <circle cx="5" cy="18" r="0.5" fill="currentColor" stroke="none"></circle>
                    <path d="M7 18h4"></path>
                    <path d="M14 19v-4"></path>
                    <path d="M16 19v-6"></path>
                    <path d="M18 19v-2"></path>
                    <path d="M20 19v-5"></path>
                    <path d="M13 19h8"></path>
                </svg>
                UNIBEN Admin Panel
            </div>
            <a href="#" onclick="logout()" style="color: red; text-decoration: none;"><b>Logout</b></a>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 25px; color: var(--primary); display: flex; align-items: center; font-weight: normal;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px; opacity: 0.9;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path>
                <path d="M14 2v6h6"></path>
                <line x1="8" y1="10" x2="16" y2="10"></line>
                <line x1="8" y1="14" x2="11" y2="14"></line>
                <circle cx="16.5" cy="16.5" r="3.5"></circle>
                <line x1="19" y1="19" x2="22" y2="22"></line>
            </svg>
            Final Class Summary
        </h2>

        <div class="summary-banner">
            <div class="summary-item">
                <p>Global AI Usage</p>
                <h1 id="globalUsage">0%</h1>
            </div>
            <div class="summary-item">
                <p>Avg. AI Probability</p>
                <h1 id="avgProbability">0%</h1>
            </div>
            <div class="summary-item">
                <p>Total Submissions</p>
                <h1 id="totalSubmissions">0</h1>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-box">
                <canvas id="verdictChart"></canvas>
            </div>
            <div class="chart-box">
                <h3 style="text-align: center;">Distribution Details</h3>
                <div id="statsText" style="margin-top: 30px; font-size: 1.2rem; line-height: 2;"></div>
            </div>
        </div>

        <h2>Submission History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Student Name</th>
                    <th>Matric No</th>
                    <th>Score</th>
                    <th>Verdict</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="site-footer">
        &copy; 2026 Department of Computer Engineering, University of Benin. All Rights Reserved.
    </div>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
